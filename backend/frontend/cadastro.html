<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Cadastro - Epiq</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:#f4f5f7; color:#1a1a1a; }
  header { background:#0d2b4e; color:#fff; padding:16px 20px; }
  header h1 { font-size:17px; margin:0; }
  .container { max-width:420px; margin:0 auto; padding:16px; }
  select, input { width:100%; padding:12px; margin-bottom:12px; border:1px solid #d0d4da; border-radius:8px; font-size:15px; background:#fff; }
  label { font-size:13px; font-weight:600; color:#444; display:block; margin-bottom:4px; }
  .photo-wrap { text-align:center; margin-bottom:16px; }
  #photoPreview { width:120px; height:120px; border-radius:50%; object-fit:cover; background:#ddd; display:block; margin:0 auto 10px; }
  .photo-btn { padding:10px 16px; border:1px solid #0d2b4e; color:#0d2b4e; background:#fff; border-radius:20px; font-size:13px; cursor:pointer; }
  .save-btn { width:100%; padding:14px; border:none; border-radius:8px; background:#1a7a3c; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  #status { text-align:center; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<header><h1>Meu Cadastro</h1></header>
<div class="container">

  <div class="field">
    <label>Quem é você?</label>
    <select id="employeeSelect"></select>
  </div>

  <div class="photo-wrap">
    <img id="photoPreview" src="">
    <input type="file" id="photoInput" accept="image/*" capture="user" style="display:none">
    <button class="photo-btn" onclick="document.getElementById('photoInput').click()">Alterar foto</button>
  </div>

  <div class="field"><label>Nome completo</label><input id="name"></div>
  <div class="field"><label>Telefone</label><input id="phone"></div>
  <div class="field"><label>Email</label><input id="email"></div>

  <button class="save-btn" id="saveBtn">Salvar alterações</button>
  <div id="status"></div>
</div>

<script>
const API = "";
let currentId = null;

async function loadEmployees() {
  const list = await fetch(`${API}/api/employees`).then(r => r.json());
  const sel = document.getElementById('employeeSelect');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    list.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  const saved = localStorage.getItem('employee_id');
  if (saved) { sel.value = saved; loadProfile(saved); }
}

async function loadProfile(id) {
  if (!id) return;
  currentId = id;
  const emp = await fetch(`${API}/api/employees/${id}`).then(r => r.json());
  document.getElementById('name').value = emp.name || '';
  document.getElementById('phone').value = emp.phone || '';
  document.getElementById('email').value = emp.email || '';
  document.getElementById('photoPreview').src = emp.photo_url || 'https://placehold.co/120x120?text=Foto';
}

document.getElementById('employeeSelect').addEventListener('change', e => {
  localStorage.setItem('employee_id', e.target.value);
  loadProfile(e.target.value);
});

document.getElementById('photoInput').addEventListener('change', async e => {
  if (!currentId) return alert('Selecione seu nome primeiro.');
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('photoPreview').src = URL.createObjectURL(file);
  const form = new FormData();
  form.append('file', file);
  await fetch(`${API}/api/employees/${currentId}/photo`, { method: 'POST', body: form });
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (!currentId) return alert('Selecione seu nome primeiro.');
  const payload = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
  };
  const res = await fetch(`${API}/api/employees/${currentId}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  document.getElementById('status').innerText = res.ok ? '✅ Salvo!' : '❌ Erro ao salvar.';
});

loadEmployees();
</script>
</body>
</html>
