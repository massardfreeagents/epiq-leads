<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Captura de Leads - Epiq</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0; background: #f4f5f7; color: #1a1a1a;
    padding-bottom: 40px;
  }
  header {
    background: #0d2b4e; color: #fff; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #cfe0f5; font-size: 13px; text-decoration: none; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }
  select, input, textarea {
    width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #d0d4da;
    border-radius: 8px; font-size: 15px; background: #fff;
  }
  label { font-size: 13px; font-weight: 600; color: #444; display: block; margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .camera-btn, .mic-btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: #0d2b4e; color: #fff; font-size: 15px; font-weight: 600;
    margin-bottom: 12px; cursor: pointer;
  }
  .mic-btn.recording { background: #c0392b; }
  .interests { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .interest-tag {
    padding: 8px 12px; border-radius: 20px; border: 1px solid #0d2b4e;
    font-size: 13px; cursor: pointer; user-select: none; background: #fff; color: #0d2b4e;
  }
  .interest-tag.active { background: #0d2b4e; color: #fff; }
  .classification { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 8px; }
  .class-circle {
    flex: 1; aspect-ratio: 1; border-radius: 50%; border: 2px solid #0d2b4e;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #0d2b4e; cursor: pointer; background: #fff;
  }
  .class-circle.active { background: #0d2b4e; color: #fff; }
  .submit-btn {
    width: 100%; padding: 16px; border: none; border-radius: 8px;
    background: #1a7a3c; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .submit-btn:disabled { background: #9aa; }
  #status { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Captura de Leads — Epiq</h1>
  <a href="/cadastro.html">Meu cadastro</a>
</header>

<div class="container">

  <div class="field">
    <label>Funcionário</label>
    <select id="employeeSelect"></select>
  </div>

  <button class="camera-btn" onclick="document.getElementById('badgeInput').click()">📷 Tirar foto do crachá</button>
  <input type="file" id="badgeInput" accept="image/*" capture="environment" style="display:none">

  <div class="field"><label>Nome</label><input id="first_name"></div>
  <div class="field"><label>Sobrenome</label><input id="last_name"></div>
  <div class="field"><label>Empresa</label><input id="company"></div>
  <div class="field"><label>Cargo</label><input id="position"></div>
  <div class="field"><label>Telefone</label><input id="phone" placeholder="+55..."></div>
  <div class="field"><label>Email</label><input id="email"></div>

  <label>Interesse em:</label>
  <div class="interests" id="interests">
    <div class="interest-tag" data-value="Investigação">Investigação</div>
    <div class="interest-tag" data-value="Compliance">Compliance</div>
    <div class="interest-tag" data-value="Auditoria Interna">Auditoria Interna</div>
    <div class="interest-tag" data-value="Controles Internos">Controles Internos</div>
    <div class="interest-tag" data-value="Forense">Forense</div>
    <div class="interest-tag" data-value="eDiscovery">eDiscovery</div>
    <div class="interest-tag" data-value="Assinatura">Assinatura</div>
    <div class="interest-tag" data-value="MSA">MSA</div>
    <div class="interest-tag" data-value="Pediu apresentação">Pediu apresentação</div>
    <div class="interest-tag" data-value="Curso">Curso</div>
  </div>

  <div class="field">
    <label>Observações</label>
    <textarea id="notes" rows="3" placeholder="Digite ou grave por voz..."></textarea>
  </div>
  <button class="mic-btn" id="micBtn">🎤 Gravar observação por voz</button>

  <div class="classification" id="classification">
    <div class="class-circle" data-value="A">A</div>
    <div class="class-circle" data-value="B">B</div>
    <div class="class-circle" data-value="C">C</div>
    <div class="class-circle" data-value="D">D</div>
  </div>

  <button class="submit-btn" id="submitBtn">Salvar Lead e Enviar</button>
  <div id="status"></div>
</div>

<script>
const API = ""; // mesma origem
let selectedInterests = new Set();
let selectedClass = null;

// carregar funcionários
fetch(`${API}/api/employees`).then(r => r.json()).then(list => {
  const sel = document.getElementById('employeeSelect');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    list.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  const saved = localStorage.getItem('employee_id');
  if (saved) sel.value = saved;
});
document.getElementById('employeeSelect').addEventListener('change', e => {
  localStorage.setItem('employee_id', e.target.value);
});

// interesses
document.querySelectorAll('.interest-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    const v = tag.dataset.value;
    if (selectedInterests.has(v)) { selectedInterests.delete(v); tag.classList.remove('active'); }
    else { selectedInterests.add(v); tag.classList.add('active'); }
  });
});

// classificação
document.querySelectorAll('.class-circle').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.class-circle').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    selectedClass = c.dataset.value;
  });
});

// foto do crachá -> só OCR, não salva nem mostra a foto
document.getElementById('badgeInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  document.getElementById('status').innerText = 'Lendo crachá...';

  const ocrForm = new FormData();
  ocrForm.append('file', file);
  const res = await fetch(`${API}/api/ocr`, { method: 'POST', body: ocrForm });
  const data = await res.json();
  document.getElementById('first_name').value = data.first_name || '';
  document.getElementById('last_name').value = data.last_name || '';
  document.getElementById('company').value = data.company || '';
  document.getElementById('position').value = data.position || '';
  document.getElementById('phone').value = data.phone || '';
  document.getElementById('email').value = data.email || '';
  document.getElementById('status').innerText = 'Confira e ajuste os campos abaixo.';
});

// gravação de voz
let mediaRecorder, audioChunks = [];
document.getElementById('micBtn').addEventListener('click', async () => {
  const btn = document.getElementById('micBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);
  audioChunks = [];
  mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
  mediaRecorder.onstop = async () => {
    btn.classList.remove('recording');
    btn.innerText = '🎤 Gravar observação por voz';
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    const form = new FormData();
    form.append('file', blob, 'audio.webm');
    document.getElementById('status').innerText = 'Transcrevendo áudio...';
    const res = await fetch(`${API}/api/transcribe`, { method: 'POST', body: form });
    const data = await res.json();
    const notes = document.getElementById('notes');
    notes.value = (notes.value ? notes.value + ' ' : '') + data.text;
    document.getElementById('status').innerText = '';
  };
  mediaRecorder.start();
  btn.classList.add('recording');
  btn.innerText = '⏹ Parar gravação';
});

// envio do lead
document.getElementById('submitBtn').addEventListener('click', async () => {
  const employeeId = document.getElementById('employeeSelect').value;
  if (!employeeId) return alert('Selecione o funcionário.');
  if (!document.getElementById('first_name').value) return alert('Preencha ao menos o nome.');
  if (!selectedClass) return alert('Selecione a classificação (A, B, C ou D).');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('status').innerText = 'Salvando e enviando...';

  const payload = {
    employee_id: parseInt(employeeId),
    first_name: document.getElementById('first_name').value,
    last_name: document.getElementById('last_name').value,
    company: document.getElementById('company').value,
    position: document.getElementById('position').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    interests: Array.from(selectedInterests),
    notes: document.getElementById('notes').value,
    classification: selectedClass,
  };

  const res = await fetch(`${API}/api/leads`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (res.ok) {
    document.getElementById('status').innerText = '✅ Lead salvo! Folder sendo enviado.';
    ['first_name','last_name','company','position','phone','email','notes'].forEach(id => document.getElementById(id).value = '');
    document.querySelectorAll('.interest-tag.active').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.class-circle.active').forEach(t => t.classList.remove('active'));
    selectedInterests.clear(); selectedClass = null;
  } else {
    document.getElementById('status').innerText = '❌ Erro ao salvar. Tente novamente.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
